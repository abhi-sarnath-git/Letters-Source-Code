name: Letters iPhone preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letters-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build Letters
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test server admission and contact boundaries
        run: python3 -m unittest discover -s server -v
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Test invitations, alert lifecycle and release-readiness bookkeeping
        working-directory: LettersCore
        run: swift test
      - name: Build unsigned iPhone simulator preview
        run: >-
          xcodebuild -project Letters.xcodeproj -scheme Letters
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Launch preview and capture iPhone screenshot
        run: bash scripts/capture-preview.sh
      - name: Package downloadable simulator preview
        run: bash scripts/package-simulator.sh
      - name: Save simulator download
        uses: actions/upload-artifact@v7
        with:
          name: letters-simulator-download
          path: |
            ${{ runner.temp }}/letters-download/Letters-Simulator-Preview.zip
            ${{ runner.temp }}/letters-download/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save portfolio screenshot
        uses: actions/upload-artifact@v7
        with:
          name: letters-iphone-preview
          path: ${{ runner.temp }}/letters-preview/*.png
          if-no-files-found: error
          retention-days: 7

      # No signing secrets or physical-device distribution. Launching the offline
      # preview is a smoke check, not interactive UI QA or evidence of E2EE.
